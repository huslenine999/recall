<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alg Trainer</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1b1b1b;--mute:#666;--line:#ddd;--accent:#2b6cd8;--bad:#c0392b;--ok:#2e8b57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1f2226;--ink:#ececec;--mute:#9aa0a6;--line:#33383d;--accent:#6ea1ff;--bad:#ff7a6b;--ok:#5fd093}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1f2226;--ink:#ececec;--mute:#9aa0a6;--line:#33383d;--accent:#6ea1ff;--bad:#ff7a6b;--ok:#5fd093}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:0 16px 40px}
header{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:5}
.tabs{display:flex;gap:8px}
.tab,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
select,input[type=color]{font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);padding:4px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.grid.sq{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:6px}
.card .alg{font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);word-break:break-word}
.card .alg b{color:var(--ink)}
.diagram{width:100%;height:auto;display:block}
.ph{height:120px;display:flex;align-items:center;justify-content:center;color:var(--bad);font-size:13px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.tag{font-size:11px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.note{font-size:12px;color:var(--mute)}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin:8px 0}
.colors label{display:flex;align-items:center;gap:6px;font-size:13px}

.subs{display:flex;gap:4px;margin-top:8px;border-bottom:1px solid var(--line)}
.sub{border:0;background:none;color:var(--mute);font:inherit;padding:6px 12px;cursor:pointer;border-bottom:2px solid transparent}
.sub[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--mute)}
.train{display:grid;grid-template-columns:1fr;gap:16px;margin-top:12px}
@media (min-width:900px){.train{grid-template-columns:1fr 1fr;align-items:start}}
.scramble{font:600 clamp(18px,5vw,26px)/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;user-select:none}
.hint{margin:6px 0 10px}
.timer{display:flex;align-items:center;justify-content:center;min-height:min(60vh,420px);border-radius:14px;background:var(--card);border:2px solid var(--line);font:700 clamp(56px,18vw,120px)/1 ui-monospace,Menlo,Consolas,monospace;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.timer.hold{background:#7a2323;color:#fff;border-color:#7a2323}
.timer.armed{background:#1e8a45;color:#fff;border-color:#1e8a45}
.timer.stopped{border-color:var(--accent)}
.reveal h2{margin:0 0 6px;font-size:20px;display:flex;gap:8px;align-items:center}
.reveal .alg,.row .alg{font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-word;margin:4px 0}
.alg.bad{color:var(--bad)}
.diagwrap{max-width:360px;margin:6px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.empty{color:var(--mute)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.row.dim{opacity:.7}
.pick input{width:20px;height:20px}
.rstat{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.chip{font:inherit;font-size:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:2px 10px;cursor:pointer}
.chip.s-Learning{border-color:#d19a1e;color:#d19a1e}
.chip.s-Learned{border-color:var(--ok);color:var(--ok)}
.settings{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.chk{display:flex;gap:8px;align-items:center}
.editor{padding:8px 0 12px 38px;border-bottom:1px solid var(--line)}
.editor textarea{width:100%;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}
.pv{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0}
.pv .bad{color:var(--bad)}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-mm" aria-selected="true">Megaminx PLL</button>
    <button class="tab" role="tab" id="tab-sq" aria-selected="false">Square-1 EP</button>
  </div>
  <nav class="subs" role="tablist"><button class="sub" data-s="train">Train</button><button class="sub" data-s="cases">Cases</button><button class="sub" data-s="settings">Settings</button></nav>
</header>
<main id="main"></main>
<script>

</script>
<script>

</script>
<script>

</script>
</body>
</html>
